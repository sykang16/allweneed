<title>모두의 요구사항 한 번에!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="고객 니즈·회의록·참고문서를 넣으면 민감정보를 가린 뒤 AI가 요구사항을 추출·분류하고, 누락·충돌을 점검해 표준 양식 개발요청서를 만드는 도구">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
/* 레이아웃: 상단 고정 헤더 + 5단계 진행 표시줄, 아래로 단계별 작업 화면. 결과 문서는 종이 질감 미리보기. */
:root {
  --bg: #F3F5F3;
  --surface: #FFFFFF;
  --sunk: #E9EEEB;
  --ink: #18211F;
  --ink-2: #44514D;
  --muted: #6A7773;
  --line: #D6DEDA;
  --accent: #1E5C57;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBE7;
  --redact-bg: #18211F;
  --redact-fg: #E9EEEB;
  --restore: #FFF1B8;
  --ok: #2D7A4B; --ok-soft: #DDF0E3;
  --cond: #A86A0C; --cond-soft: #FBEBCF;
  --no: #B03A3A; --no-soft: #F7DEDC;
  --open: #4752A8; --open-soft: #E2E5F7;
  --paper: #FFFFFF; --paper-ink: #1B1F1E; --paper-line: #B9C4C0; --paper-head: #E4EEEA;
  --shadow: 0 1px 2px rgba(20, 40, 35, .06), 0 4px 16px rgba(20, 40, 35, .05);
  --f-body: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
  --f-display: 'Noto Serif KR', 'Batang', 'AppleMyungjo', serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'Consolas', monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111716; --surface: #18201E; --sunk: #202a28; --ink: #E4ECE9; --ink-2: #BCC8C4; --muted: #8E9C98; --line: #2E3A37;
    --accent: #6FC0B4; --accent-ink: #0D1413; --accent-soft: #1E3430;
    --redact-bg: #E4ECE9; --redact-fg: #18211F; --restore: #4A4118;
    --ok: #6CCB8F; --ok-soft: #1C3426; --cond: #E3AE55; --cond-soft: #3A2D14; --no: #EE8A84; --no-soft: #3D2120; --open: #9DA7F0; --open-soft: #262B4A;
    --paper: #1C2422; --paper-ink: #E4ECE9; --paper-line: #3B4946; --paper-head: #243431;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111716; --surface: #18201E; --sunk: #202a28; --ink: #E4ECE9; --ink-2: #BCC8C4; --muted: #8E9C98; --line: #2E3A37;
  --accent: #6FC0B4; --accent-ink: #0D1413; --accent-soft: #1E3430;
  --redact-bg: #E4ECE9; --redact-fg: #18211F; --restore: #4A4118;
  --ok: #6CCB8F; --ok-soft: #1C3426; --cond: #E3AE55; --cond-soft: #3A2D14; --no: #EE8A84; --no-soft: #3D2120; --open: #9DA7F0; --open-soft: #262B4A;
  --paper: #1C2422; --paper-ink: #E4ECE9; --paper-line: #3B4946; --paper-head: #243431;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.35; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
h4 { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; margin-top: 4px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-size: 13px; }
.grow { flex: 1; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.wrap { flex-wrap: wrap; }
.empty { color: var(--muted); padding: 16px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); font-size: 14px; }

/* 헤더 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.brand h1 em { font-style: normal; color: var(--accent); }
.brand p { color: var(--muted); font-size: 13px; }
.ai-badge { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; padding: 4px 10px; border-radius: 99px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.ai-badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.ai-badge.ready { background: var(--ok-soft); color: var(--ok); } .ai-badge.ready i { background: var(--ok); }
.ai-badge.demo, .ai-badge.denied { background: var(--cond-soft); color: var(--cond); } .ai-badge.demo i, .ai-badge.denied i { background: var(--cond); }
.ai-badge.checking i { animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.stepper { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 10px; display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.step { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--muted); white-space: nowrap; font-size: 14px; }
.step b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-family: var(--f-mono); border: 1.5px solid var(--line); background: var(--surface); }
.step.done { color: var(--ink-2); } .step.done b { border-color: var(--accent); color: var(--accent); }
.step.on { color: var(--ink); font-weight: 600; } .step.on b { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step:disabled { opacity: .45; cursor: default; }
.step:not(:disabled):hover { background: var(--sunk); }
.step-line { flex: 0 0 18px; height: 1.5px; background: var(--line); }

main { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.review-head, .tabs, .tab-body, .bar, .intro, .src-grid { min-width: 0; }

/* 공통 부품 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; line-height: 1.3; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--no); border-color: var(--no); }
.btn.big { padding: 11px 20px; font-size: 15px; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.link { border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; }
.icon-btn { border: 0; background: none; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 16px; flex: none; }
.icon-btn:hover:not(:disabled) { background: var(--sunk); color: var(--ink); }
.icon-btn:disabled { opacity: .3; cursor: default; }
input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 10px; font-size: 14px; min-width: 0; }
textarea { resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.fld { display: grid; gap: 4px; min-width: 0; } .fld > span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.count { font-family: var(--f-mono); font-size: 12px; font-weight: 500; background: var(--sunk); color: var(--ink-2); padding: 1px 7px; border-radius: 99px; }
.sid { font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; flex: none; }
.tag { font-size: 11.5px; background: var(--open-soft); color: var(--open); padding: 1px 6px; border-radius: 4px; flex: none; }
.lbl { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em; margin-right: 6px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--accent); }
.notice { padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); font-size: 14px; }
.notice.warn { background: var(--cond-soft); } .notice.err { background: var(--no-soft); color: var(--no); } .notice.ok { background: var(--ok-soft); color: var(--ok); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.bar.inner { padding: 12px 14px; border-radius: var(--r); background: var(--sunk); }
.pill { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.cond { background: var(--cond-soft); color: var(--cond); } .pill.no { background: var(--no-soft); color: var(--no); } .pill.open { background: var(--open-soft); color: var(--open); }
.ref { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 0 6px; font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--accent); cursor: pointer; line-height: 20px; vertical-align: middle; }
.ref small { font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: 11px; }
.ref:hover { border-color: var(--accent); }
.reqchip { font-family: var(--f-mono); font-size: 12px; font-weight: 600; border: 0; background: var(--sunk); color: var(--ink); padding: 1px 7px; border-radius: 4px; cursor: pointer; }
.reqchip:hover { background: var(--accent-soft); } .reqchip.all { cursor: default; color: var(--muted); }
.redact { background: var(--redact-bg); color: var(--redact-fg); font-family: var(--f-mono); font-size: .86em; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
.unmasked { border-bottom: 1.5px dashed var(--cond); }
.tok { font-family: var(--f-mono); font-size: .86em; background: var(--sunk); padding: 0 4px; border-radius: 3px; white-space: nowrap; }
.restored { background: linear-gradient(transparent 55%, var(--restore) 55%); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.seg { display: flex; gap: 4px; background: var(--sunk); padding: 3px; border-radius: 7px; width: fit-content; max-width: 100%; flex-wrap: wrap; }
.seg > button, .seg > label { border: 0; background: transparent; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.seg > button.on, .seg > label:has(input:checked) { background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
.seg input[type=radio] { width: 14px; height: 14px; }

/* 1단계 */
.intro { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
.intro h2 { font-family: var(--f-display); font-size: 25px; margin-bottom: 8px; letter-spacing: -.01em; }
.intro p { color: var(--ink-2); max-width: 62ch; }
.sample-note { display: grid; gap: 6px; align-content: start; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--cond); }
.sample-note span { font-size: 13.5px; color: var(--ink-2); }
.sample-note .row { margin-top: 6px; }
.src-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.src-col { display: grid; gap: 10px; min-width: 0; }
.src-col > header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.src-col > header .muted { font-size: 12.5px; }
.src-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; min-width: 0; }
.src-head { display: flex; gap: 8px; align-items: center; min-width: 0; }
.src-head .src-title { font-weight: 600; border-color: transparent; padding-inline: 4px; }
.src-head .src-title:hover { border-color: var(--line); }
.src-meta { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: 6px; }
.src-meta input { font-size: 13px !important; padding: 5px 8px !important; }
.src-card textarea { font-size: 13.5px; background: var(--bg); }
.src-add { display: flex; gap: 8px; flex-wrap: wrap; }
.drop { flex: 1; min-width: 160px; display: grid; justify-items: center; gap: 0; padding: 10px; border: 1.5px dashed var(--line); border-radius: var(--r); cursor: pointer; text-align: center; background: var(--surface); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop span { font-size: 14px; font-weight: 500; color: var(--accent); }
.drop small { font-size: 11.5px; color: var(--muted); }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop.inline { flex: none; min-width: 0; padding: 7px 14px; }

/* 2단계 */
.mask-layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
.mask-side { position: sticky; top: 120px; max-height: calc(100vh - 140px); overflow: auto; }
.mgroup { display: grid; gap: 4px; }
.mrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 13.5px; padding: 4px 6px; border-radius: 5px; cursor: pointer; }
.mrow:hover { background: var(--sunk); }
.mrow.off .mval { text-decoration: line-through; color: var(--muted); }
.mval { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mtok { font-family: var(--f-mono); font-size: 11.5px; background: var(--redact-bg); color: var(--redact-fg); padding: 0 5px; border-radius: 3px; }
.mcnt { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: var(--sunk); border-radius: 99px; padding: 2px 4px 2px 10px; font-size: 13px; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; }
.mask-preview { display: grid; gap: 14px; min-width: 0; }
.prev header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prev-meta { font-size: 13px; color: var(--muted); }
.prev-text { white-space: pre-wrap; font-family: var(--f-body); font-size: 14px; line-height: 1.75; margin: 0; background: var(--bg); padding: 12px 14px; border-radius: 6px; max-height: 460px; overflow: auto; }

/* 3단계 */
.analyze { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 20px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0; }
.stats div { background: var(--bg); border-radius: 6px; padding: 10px 12px; }
.stats dt { font-size: 12px; color: var(--muted); }
.stats dd { margin: 0; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--f-mono); }
.stats dd small { font-size: 13px; font-family: var(--f-body); color: var(--muted); margin-left: 2px; }
.src-mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
.src-mini li { display: flex; gap: 8px; align-items: baseline; }
.stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.stages li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 8px 0; align-items: start; }
.stages li i { width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--line); position: relative; }
.stages li.run i { border-color: var(--accent); border-top-color: transparent; animation: spin .9s linear infinite; }
.stages li.done i { background: var(--accent); border-color: var(--accent); }
.stages li.done i::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.stages li.err i { border-color: var(--no); background: var(--no-soft); }
.stages b { display: block; font-size: 14.5px; } .stages span { font-size: 13px; color: var(--muted); }
.stages li.wait b { color: var(--muted); }
.live { display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: var(--sunk); border-radius: var(--r); font-size: 14px; flex-wrap: wrap; }

/* 4단계 */
.review-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.review-head > div { display: grid; gap: 4px; max-width: 80ch; }
.review-head h2 { font-family: var(--f-display); font-size: 24px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-size: 14.5px; color: var(--muted); border-bottom: 2.5px solid transparent; margin-bottom: -1px; display: flex; gap: 7px; align-items: center; white-space: nowrap; }
.tabs button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--ink); }
.tab-body { display: grid; gap: 16px; min-width: 0; }
.req-summary { display: grid; gap: 10px; }
.sbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--sunk); }
.sbar span.ok { background: var(--ok); } .sbar span.cond { background: var(--cond); } .sbar span.no { background: var(--no); } .sbar span.open { background: var(--open); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 12px; cursor: pointer; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }
.fchip b { font-family: var(--f-mono); font-size: 12px; font-weight: 600; }
.fchip.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.req-tbl, .at-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.req-tbl th, .at-tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.req-tbl td, .at-tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.req-tbl tbody tr:last-child td, .at-tbl tbody tr:last-child td { border-bottom: 0; }
