<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<script src="config.js"></script>
</head>
<body>
<title>모두의 요구사항 한 번에!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="고객 니즈·회의록·참고문서를 넣으면 민감정보를 가린 뒤 AI가 요구사항을 추출·분류하고, 누락·충돌을 점검해 표준 양식 개발요청서를 만드는 도구">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
/* 레이아웃: 상단 고정 헤더 + 5단계 진행 표시줄, 아래로 단계별 작업 화면. 결과 문서는 종이 질감 미리보기. */
:root {
  --bg: #F3F5F3;
  --surface: #FFFFFF;
  --sunk: #E9EEEB;
  --ink: #18211F;
  --ink-2: #44514D;
  --muted: #6A7773;
  --line: #D6DEDA;
  --accent: #1E5C57;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBE7;
  --redact-bg: #18211F;
  --redact-fg: #E9EEEB;
  --restore: #FFF1B8;
  --ok: #2D7A4B; --ok-soft: #DDF0E3;
  --cond: #A86A0C; --cond-soft: #FBEBCF;
  --no: #B03A3A; --no-soft: #F7DEDC;
  --open: #4752A8; --open-soft: #E2E5F7;
  --paper: #FFFFFF; --paper-ink: #1B1F1E; --paper-line: #B9C4C0; --paper-head: #E4EEEA;
  --shadow: 0 1px 2px rgba(20, 40, 35, .06), 0 4px 16px rgba(20, 40, 35, .05);
  --f-body: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
  --f-display: 'Noto Serif KR', 'Batang', 'AppleMyungjo', serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'Consolas', monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111716; --surface: #18201E; --sunk: #202a28; --ink: #E4ECE9; --ink-2: #BCC8C4; --muted: #8E9C98; --line: #2E3A37;
    --accent: #6FC0B4; --accent-ink: #0D1413; --accent-soft: #1E3430;
    --redact-bg: #E4ECE9; --redact-fg: #18211F; --restore: #4A4118;
    --ok: #6CCB8F; --ok-soft: #1C3426; --cond: #E3AE55; --cond-soft: #3A2D14; --no: #EE8A84; --no-soft: #3D2120; --open: #9DA7F0; --open-soft: #262B4A;
    --paper: #1C2422; --paper-ink: #E4ECE9; --paper-line: #3B4946; --paper-head: #243431;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111716; --surface: #18201E; --sunk: #202a28; --ink: #E4ECE9; --ink-2: #BCC8C4; --muted: #8E9C98; --line: #2E3A37;
  --accent: #6FC0B4; --accent-ink: #0D1413; --accent-soft: #1E3430;
  --redact-bg: #E4ECE9; --redact-fg: #18211F; --restore: #4A4118;
  --ok: #6CCB8F; --ok-soft: #1C3426; --cond: #E3AE55; --cond-soft: #3A2D14; --no: #EE8A84; --no-soft: #3D2120; --open: #9DA7F0; --open-soft: #262B4A;
  --paper: #1C2422; --paper-ink: #E4ECE9; --paper-line: #3B4946; --paper-head: #243431;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.35; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
h4 { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; margin-top: 4px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-size: 13px; }
.grow { flex: 1; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.wrap { flex-wrap: wrap; }
.empty { color: var(--muted); padding: 16px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); font-size: 14px; }

/* 헤더 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.brand h1 em { font-style: normal; color: var(--accent); }
.brand p { color: var(--muted); font-size: 13px; }
.ai-badge { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; padding: 4px 10px; border-radius: 99px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.ai-badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.ai-badge.ready { background: var(--ok-soft); color: var(--ok); } .ai-badge.ready i { background: var(--ok); }
.ai-badge.demo, .ai-badge.denied { background: var(--cond-soft); color: var(--cond); } .ai-badge.demo i, .ai-badge.denied i { background: var(--cond); }
.ai-badge.checking i { animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.stepper { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 10px; display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.step { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--muted); white-space: nowrap; font-size: 14px; }
.step b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-family: var(--f-mono); border: 1.5px solid var(--line); background: var(--surface); }
.step.done { color: var(--ink-2); } .step.done b { border-color: var(--accent); color: var(--accent); }
.step.on { color: var(--ink); font-weight: 600; } .step.on b { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step:disabled { opacity: .45; cursor: default; }
.step:not(:disabled):hover { background: var(--sunk); }
.step-line { flex: 0 0 18px; height: 1.5px; background: var(--line); }

main { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.review-head, .tabs, .tab-body, .bar, .intro, .src-grid { min-width: 0; }

/* 공통 부품 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; line-height: 1.3; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--no); border-color: var(--no); }
.btn.big { padding: 11px 20px; font-size: 15px; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.link { border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; }
.icon-btn { border: 0; background: none; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 16px; flex: none; }
.icon-btn:hover:not(:disabled) { background: var(--sunk); color: var(--ink); }
.icon-btn:disabled { opacity: .3; cursor: default; }
input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 10px; font-size: 14px; min-width: 0; }
textarea { resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.fld { display: grid; gap: 4px; min-width: 0; } .fld > span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.count { font-family: var(--f-mono); font-size: 12px; font-weight: 500; background: var(--sunk); color: var(--ink-2); padding: 1px 7px; border-radius: 99px; }
.sid { font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; flex: none; }
.tag { font-size: 11.5px; background: var(--open-soft); color: var(--open); padding: 1px 6px; border-radius: 4px; flex: none; }
.lbl { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em; margin-right: 6px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--accent); }
.notice { padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); font-size: 14px; }
.notice.warn { background: var(--cond-soft); } .notice.err { background: var(--no-soft); color: var(--no); } .notice.ok { background: var(--ok-soft); color: var(--ok); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.bar.inner { padding: 12px 14px; border-radius: var(--r); background: var(--sunk); }
.pill { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.cond { background: var(--cond-soft); color: var(--cond); } .pill.no { background: var(--no-soft); color: var(--no); } .pill.open { background: var(--open-soft); color: var(--open); }
.ref { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 0 6px; font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--accent); cursor: pointer; line-height: 20px; vertical-align: middle; }
.ref small { font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: 11px; }
.ref:hover { border-color: var(--accent); }
.reqchip { font-family: var(--f-mono); font-size: 12px; font-weight: 600; border: 0; background: var(--sunk); color: var(--ink); padding: 1px 7px; border-radius: 4px; cursor: pointer; }
.reqchip:hover { background: var(--accent-soft); } .reqchip.all { cursor: default; color: var(--muted); }
.redact { background: var(--redact-bg); color: var(--redact-fg); font-family: var(--f-mono); font-size: .86em; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
.unmasked { border-bottom: 1.5px dashed var(--cond); }
.tok { font-family: var(--f-mono); font-size: .86em; background: var(--sunk); padding: 0 4px; border-radius: 3px; white-space: nowrap; }
.restored { background: linear-gradient(transparent 55%, var(--restore) 55%); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.seg { display: flex; gap: 4px; background: var(--sunk); padding: 3px; border-radius: 7px; width: fit-content; max-width: 100%; flex-wrap: wrap; }
.seg > button, .seg > label { border: 0; background: transparent; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.seg > button.on, .seg > label:has(input:checked) { background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
.seg input[type=radio] { width: 14px; height: 14px; }

/* 1단계 */
.intro { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
.intro h2 { font-family: var(--f-display); font-size: 25px; margin-bottom: 8px; letter-spacing: -.01em; }
.intro p { color: var(--ink-2); max-width: 62ch; }
.sample-note { display: grid; gap: 6px; align-content: start; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--cond); }
.sample-note span { font-size: 13.5px; color: var(--ink-2); }
.sample-note .row { margin-top: 6px; }
.src-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.src-col { display: grid; gap: 10px; min-width: 0; }
.src-col > header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.src-col > header .muted { font-size: 12.5px; }
.src-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; min-width: 0; }
.src-head { display: flex; gap: 8px; align-items: center; min-width: 0; }
.src-head .src-title { font-weight: 600; border-color: transparent; padding-inline: 4px; }
.src-head .src-title:hover { border-color: var(--line); }
.src-meta { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: 6px; }
.src-meta input { font-size: 13px !important; padding: 5px 8px !important; }
.src-card textarea { font-size: 13.5px; background: var(--bg); }
.src-add { display: flex; gap: 8px; flex-wrap: wrap; }
.drop { flex: 1; min-width: 160px; display: grid; justify-items: center; gap: 0; padding: 10px; border: 1.5px dashed var(--line); border-radius: var(--r); cursor: pointer; text-align: center; background: var(--surface); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop span { font-size: 14px; font-weight: 500; color: var(--accent); }
.drop small { font-size: 11.5px; color: var(--muted); }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop.inline { flex: none; min-width: 0; padding: 7px 14px; }

/* 2단계 */
.mask-layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
.mask-side { position: sticky; top: 120px; max-height: calc(100vh - 140px); overflow: auto; }
.mgroup { display: grid; gap: 4px; }
.mrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 13.5px; padding: 4px 6px; border-radius: 5px; cursor: pointer; }
.mrow:hover { background: var(--sunk); }
.mrow.off .mval { text-decoration: line-through; color: var(--muted); }
.mval { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mtok { font-family: var(--f-mono); font-size: 11.5px; background: var(--redact-bg); color: var(--redact-fg); padding: 0 5px; border-radius: 3px; }
.mcnt { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: var(--sunk); border-radius: 99px; padding: 2px 4px 2px 10px; font-size: 13px; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; }
.mask-preview { display: grid; gap: 14px; min-width: 0; }
.prev header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prev-meta { font-size: 13px; color: var(--muted); }
.prev-text { white-space: pre-wrap; font-family: var(--f-body); font-size: 14px; line-height: 1.75; margin: 0; background: var(--bg); padding: 12px 14px; border-radius: 6px; max-height: 460px; overflow: auto; }

/* 3단계 */
.analyze { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 20px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0; }
.stats div { background: var(--bg); border-radius: 6px; padding: 10px 12px; }
.stats dt { font-size: 12px; color: var(--muted); }
.stats dd { margin: 0; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--f-mono); }
.stats dd small { font-size: 13px; font-family: var(--f-body); color: var(--muted); margin-left: 2px; }
.src-mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
.src-mini li { display: flex; gap: 8px; align-items: baseline; }
.stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.stages li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 8px 0; align-items: start; }
.stages li i { width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--line); position: relative; }
.stages li.run i { border-color: var(--accent); border-top-color: transparent; animation: spin .9s linear infinite; }
.stages li.done i { background: var(--accent); border-color: var(--accent); }
.stages li.done i::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.stages li.err i { border-color: var(--no); background: var(--no-soft); }
.stages b { display: block; font-size: 14.5px; } .stages span { font-size: 13px; color: var(--muted); }
.stages li.wait b { color: var(--muted); }
.live { display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: var(--sunk); border-radius: var(--r); font-size: 14px; flex-wrap: wrap; }

/* 4단계 */
.review-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.review-head > div { display: grid; gap: 4px; max-width: 80ch; }
.review-head h2 { font-family: var(--f-display); font-size: 24px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-size: 14.5px; color: var(--muted); border-bottom: 2.5px solid transparent; margin-bottom: -1px; display: flex; gap: 7px; align-items: center; white-space: nowrap; }
.tabs button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--ink); }
.tab-body { display: grid; gap: 16px; min-width: 0; }
.req-summary { display: grid; gap: 10px; }
.sbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--sunk); }
.sbar span.ok { background: var(--ok); } .sbar span.cond { background: var(--cond); } .sbar span.no { background: var(--no); } .sbar span.open { background: var(--open); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 12px; cursor: pointer; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }
.fchip b { font-family: var(--f-mono); font-size: 12px; font-weight: 600; }
.fchip.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.req-tbl, .at-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.req-tbl th, .at-tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.req-tbl td, .at-tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }

const MASK_RULES = [
  { type: '주민번호', re: /\b\d{6}-?[1-4]\d{6}\b/g },
  { type: '카드번호', re: /\b\d{4}[- ]\d{4}[- ]\d{4}[- ]\d{4}\b|\b\d{16}\b/g },
  { type: '이메일', re: /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g },
  { type: '휴대폰', re: /\b01[016789]-?\d{3,4}-?\d{4}\b/g },
  { type: '전화번호', re: /\b0(?:2|[3-6][1-5]|70)-\d{3,4}-\d{4}\b/g },
  { type: '사업자번호', re: /\b\d{3}-\d{2}-\d{5}\b/g },
  { type: '계좌번호', re: /\b\d{2,6}-\d{2,6}-\d{2,7}(?:-\d{1,3})?\b/g, ok: v => { const n = v.replace(/\D/g, '').length; return n >= 10 && n <= 16; } },
  { type: 'IP주소', re: /\b(?:\d{1,3}\.){3}\d{1,3}\b/g, ok: v => v.split('.').every(x => +x <= 255) },
  { type: '이름', re: new RegExp(`(?<![가-힣])[가-힣]{3}(?=\\s?(?:${TITLES}))`, 'g'), ok: v => !NAME_STOP.has(v) }
];
const MASK_TYPES = ['지정어', ...MASK_RULES.map(r => r.type)];
const TOKEN_RE = /\[([가-힣A-Za-z]+)-(\d+)\]/g;

function createMasker() {
  return { items: new Map(), byToken: new Map(), counters: {}, custom: [] };
}

function maskKey(type, value) { return type + '\u0001' + value; }

function ensureItem(M, type, value) {
  const key = maskKey(type, value);
  let it = M.items.get(key);
  if (!it) {
    M.counters[type] = (M.counters[type] || 0) + 1;
    it = { key, type, value, token: `[${type}-${M.counters[type]}]`, on: true };
    M.items.set(key, it);
    M.byToken.set(it.token, it);
  }
  return it;
}

// 텍스트에서 민감정보 구간을 찾습니다. 토큰은 이때 처음 번호가 붙고 이후 고정됩니다.
function findSpans(M, text) {
  const spans = [];
  const taken = (s, e) => spans.some(x => s < x.end && e > x.start);
  for (const w of M.custom) {
    if (!w) continue;
    let i = 0;
    while ((i = text.indexOf(w, i)) !== -1) {
      if (!taken(i, i + w.length)) spans.push({ start: i, end: i + w.length, type: '지정어', value: w });
      i += w.length;
    }
  }
  for (const rule of MASK_RULES) {
    rule.re.lastIndex = 0;
    let m;
    while ((m = rule.re.exec(text))) {
      const v = m[0];
      if (rule.ok && !rule.ok(v)) continue;
      if (!taken(m.index, m.index + v.length)) spans.push({ start: m.index, end: m.index + v.length, type: rule.type, value: v });
    }
  }
  for (const s of spans) s.item = ensureItem(M, s.type, s.value);
  // 한 번 찾은 값은 다른 곳에서 단서 없이 나와도 가립니다(예: 메일 머리글의 'From: 홍길동').
  for (const it of M.items.values()) {
    if (it.type === '지정어' || !it.value) continue;
    let i = 0;
    while ((i = text.indexOf(it.value, i)) !== -1) {
      const e = i + it.value.length;
      const inWord = it.type === '이름' && /[가-힣]/.test(text[i - 1] || '');
      if (!inWord && !taken(i, e)) spans.push({ start: i, end: e, type: it.type, value: it.value, item: it });
      i = e;
    }
  }
  spans.sort((a, b) => a.start - b.start);
  return spans;
}

function maskText(M, text) {
  const spans = findSpans(M, text);
  let out = '', pos = 0;
  for (const s of spans) {
    out += text.slice(pos, s.start) + (s.item.on ? s.item.token : s.value);
    pos = s.end;
  }
  return out + text.slice(pos);
}

function maskPreviewHTML(M, text) {
  const spans = findSpans(M, text);
  let out = '', pos = 0;
  for (const s of spans) {
    out += esc(text.slice(pos, s.start));
    out += s.item.on
      ? `<span class="redact" title="${esc(s.item.type)}: AI에 보내지 않음">${esc(s.item.token)}</span>`
      : `<span class="unmasked" title="가리지 않음: 원문 그대로 전송">${esc(s.value)}</span>`;
    pos = s.end;
  }
  return out + esc(text.slice(pos));
}

// 결과 문장의 토큰을 원래 값으로 되돌립니다. 이 브라우저 안에서만 일어납니다.
function unmask(M, text) {
  return String(text ?? '').replace(TOKEN_RE, t => { const it = M.byToken.get(t); return it ? it.value : t; });
}

// 화면 표시용: 토큰을 칩으로 바꾸거나(가림 표시) 원래 값으로 강조(복원 표시)합니다.
function richText(M, text, showOriginal) {
  return esc(text).replace(TOKEN_RE, t => {
    const it = M.byToken.get(t);
    if (!it) return t;
    return showOriginal
      ? `<span class="restored" title="${esc(it.token)} · 이 브라우저에서만 복원">${esc(it.value)}</span>`
      : `<span class="tok">${esc(it.token)}</span>`;
  });
}

const scriptCache = {};
function loadScript(url) {
  if (!scriptCache[url]) {
    scriptCache[url] = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = url; s.async = true;
      s.onload = resolve;
      s.onerror = () => { delete scriptCache[url]; reject(new Error(CFG.libBase ? `라이브러리 파일(${url})이 없습니다. fetch_vendor.py로 vendor 폴더를 채우세요.` : '라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.')); };
      document.head.appendChild(s);
    });
  }
  return scriptCache[url];
}

function decodeXml(s) {
  return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n)).replace(/&amp;/g, '&');
}
function xmlToText(xml, paraTag) {
  return decodeXml(xml.replace(new RegExp(`</${paraTag}>`, 'g'), '\n').replace(/<[^>]+>/g, '')).replace(/\n{3,}/g, '\n\n').trim();
}

async function extractText(file) {
  const name = file.name.toLowerCase();
  const ext = name.split('.').pop();
  if (['txt', 'md', 'csv', 'json', 'eml', 'log', 'tsv'].includes(ext)) return (await file.text()).trim();
  if (ext === 'pdf') {
    await loadScript(CDN.pdf);
    await loadScript(CDN.pdfWorker); // 워커를 메인 스레드에서 돌립니다(외부 워커 차단 환경 대응)
    const lib = window.pdfjsLib;
    lib.GlobalWorkerOptions.workerSrc = CDN.pdfWorker;
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const tc = await (await pdf.getPage(p)).getTextContent();
      let line = '', lastY = null;
      const lines = [];
      for (const it of tc.items) {
        const y = it.transform ? Math.round(it.transform[5]) : null;
        if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) { lines.push(line); line = ''; }
        line += it.str; lastY = y;
        if (it.hasEOL) { lines.push(line); line = ''; lastY = null; }
      }
      if (line) lines.push(line);
      pages.push(`[${p}쪽]\n` + lines.join('\n'));
    }
    const text = pages.join('\n\n').trim();
    if (text.replace(/\[\d+쪽\]/g, '').trim().length < 10) throw new Error('PDF에서 글자를 찾지 못했습니다. 스캔 이미지 PDF는 지원하지 않습니다.');
    return text;
  }
  if (ext === 'docx') {
    await loadScript(CDN.mammoth);
    const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return r.value.trim();
  }
  if (['xlsx', 'xls', 'xlsm'].includes(ext)) {
    await loadScript(CDN.xlsx);
    const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
    return wb.SheetNames.map(n => `[시트: ${n}]\n` + window.XLSX.utils.sheet_to_csv(wb.Sheets[n], { blankrows: false })).join('\n\n').trim();
  }
  if (ext === 'pptx') {
    await loadScript(CDN.jszip);
    const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
    const slides = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f))
      .sort((a, b) => +a.match(/\d+/)[0] - +b.match(/\d+/)[0]);
    const out = [];
    for (const [i, f] of slides.entries()) out.push(`[슬라이드 ${i + 1}]\n` + xmlToText(await zip.file(f).async('string'), 'a:p'));
    return out.join('\n\n').trim();
  }
  if (ext === 'hwpx') {
    await loadScript(CDN.jszip);
    const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
    const secs = Object.keys(zip.files).filter(f => /^Contents\/section\d+\.xml$/i.test(f)).sort();
    const out = [];
    for (const f of secs) out.push(xmlToText(await zip.file(f).async('string'), 'hp:p'));
    return out.join('\n\n').trim();
  }
  if (ext === 'hwp') throw new Error('HWP 파일은 바로 읽을 수 없습니다. 한글에서 HWPX나 PDF로 저장한 뒤 올려 주세요.');
  if (['doc', 'ppt'].includes(ext)) throw new Error(`.${ext} 형식은 지원하지 않습니다. .${ext}x 형식으로 저장한 뒤 올려 주세요.`);
  throw new Error(`.${ext} 형식은 지원하지 않습니다.`);
}

// 사내 LLM은 JSON 앞뒤에 설명이나 ```json 울타리를 붙이기도 합니다. 가장 바깥 { } 를 찾아 읽습니다.
function parseJSONLoose(text) {
  const t = String(text ?? '').replace(/<think>[\s\S]*?<\/think>/g, '').trim();
  try { return JSON.parse(t); } catch { /* 아래에서 다시 시도 */ }
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) { try { return JSON.parse(fence[1]); } catch { /* 계속 */ } }
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch { /* 실패 */ } }
  throw { code: 'invalid_json' };
}

const str = v => (v == null ? '' : typeof v === 'string' ? v.trim() : String(v));

const pick = (v, list, dflt) => { const s = str(v); return list.includes(s) ? s : (list.find(x => s.includes(x)) || dflt); };

    sources: arr(r.sources).map(s => ({ ref: str(s.ref), who: str(s.who), quote: str(s.quote) })),
    rationale: { extract: str(r.rationale?.extract), classify: str(r.rationale?.classify), decide: str(r.rationale?.decide) },
    confidence: pick(r.confidence, CONFIDENCE, ''),
    confirmed: !!r.confirmed
  };
}

function normalizeResult(raw) {
  const r = raw || {};
  const checks = r.checks || {};
  const m = r.meeting || {};
  return {
    project: { title: str(r.project?.title) || '요구사항 정의', summary: str(r.project?.summary), background: str(r.project?.background) },
    requirements: arr(r.requirements).map(normalizeReq),
    meeting: {
      decisions: arr(m.decisions).map(d => ({ text: str(d.text ?? d), ref: str(d.ref) })),
      openIssues: arr(m.openIssues).map(d => ({ text: str(d.text ?? d), owner: str(d.owner), ref: str(d.ref) })),
      actionItems: arr(m.actionItems).map(d => ({ task: str(d.task ?? d), owner: str(d.owner), due: str(d.due), ref: str(d.ref) }))
    },
    checks: {
      missing: arr(checks.missing ?? r.missing).map(x => ({ reqId: str(x.reqId), item: str(x.item), detail: str(x.detail), suggestion: str(x.suggestion), ref: str(x.ref) })),
      conflicts: arr(checks.conflicts ?? r.conflicts).map(x => ({ topic: str(x.topic), reqIds: arr(x.reqIds).map(str), positions: arr(x.positions).map(p => ({ who: str(p.who), stance: str(p.stance), ref: str(p.ref) })), suggestion: str(x.suggestion) })),
      ambiguous: arr(checks.ambiguous ?? r.ambiguous).map(x => ({ phrase: str(x.phrase), reqId: str(x.reqId), ref: str(x.ref), suggestion: str(x.suggestion) }))
    },
    questions: arr(r.questions ?? checks.questions).map(g => ({ to: str(g.to), role: str(g.role), items: arr(g.items).map(q => ({ q: str(q.q ?? q), reqIds: arr(q.reqIds).map(str), why: str(q.why) })) })).filter(g => g.items.length)
  };
}

function checkKey(kind, x) {
  if (kind === 'missing') return `m|${x.reqId}|${x.item}|${x.detail.slice(0, 30)}`;
  if (kind === 'conflicts') return `c|${x.topic}`;
  return `a|${x.phrase}|${x.reqId}`;
}

// ctx: {result, meta, template, sources, history, resolved, tx(text)}
function buildDocBlocks(ctx) {
  const { result, meta, template, tx } = ctx;
  const B = [];
  const T = s => tx(s ?? '');
  B.push({ t: 'title', text: T(meta.docName || template.docTitle) });
  B.push({ t: 'kv', rows: [['요청 건명', T(meta.title || result.project.title)], ['요청 부서', T(meta.dept)], ['작성자', T(meta.author)], ['작성일', T(meta.date)], ['대상 시스템', T(meta.system)], ['문서 버전', T(meta.version)]].filter(r => r[1]) });
  let n = 0;
  for (const sec of template.sections) {
    if (!sec.on) continue;
    n++;
    const H = `${n}. ${sec.label}`;
    const reqs = result.requirements;
    if (sec.key === 'overview') {
      B.push({ t: 'h1', text: H });
      if (result.project.summary) B.push({ t: 'p', text: T(result.project.summary) });
      if (result.project.background) B.push({ t: 'kv', rows: [['배경·목적', T(result.project.background)]] });
      const cnt = s => reqs.filter(r => r.status === s).length;
      B.push({ t: 'kv', rows: [['요구사항 수', `전체 ${reqs.length}건 (수용 ${cnt('수용')}, 조건부 수용 ${cnt('조건부 수용')}, 불가 ${cnt('불가')}, 미결 ${cnt('미결')})`], ['확정 현황', `${reqs.filter(r => r.confirmed).length} / ${reqs.length}건 확정`]] });
    } else if (sec.key === 'reqTable') {
      B.push({ t: 'h1', text: H });
      const cols = template.columns.filter(c => c.on);
      B.push({ t: 'table', head: cols.map(c => c.label), rows: reqs.map(r => cols.map(c => T(COLUMN_DEFS[c.key] ? COLUMN_DEFS[c.key].get(r, ctx) : ''))), wide: true });
    } else if (sec.key === 'reqDetail') {
      B.push({ t: 'h1', text: H });
      for (const r of reqs) {
        B.push({ t: 'h2', text: `${r.id} ${T(r.title)}` });
        B.push({ t: 'kv', rows: [['유형 / 우선순위', `${r.category} / ${r.priority}`], ['수용 여부', `${r.status}${r.statusReason ? ' — ' + T(r.statusReason) : ''}`], ['상세 내용', T(r.description)], ['AS-IS (현행)', T(r.asis)], ['TO-BE (개선)', T(r.tobe)], ['검수 기준', r.acceptanceCriteria.map(a => '- ' + T(a)).join('\n')], ['출처', r.sources.map(s => `[${s.ref}] ${T(s.who)}: "${T(s.quote)}"`).join('\n')]].filter(x => x[1]) });
      }
    } else if (sec.key === 'decisions') {
      B.push({ t: 'h1', text: H });
      B.push(result.meeting.decisions.length ? { t: 'bullets', items: result.meeting.decisions.map(d => `${T(d.text)}${d.ref ? ` (${d.ref})` : ''}`) } : { t: 'p', text: '없음' });
    } else if (sec.key === 'open') {
      B.push({ t: 'h1', text: H });
      B.push({ t: 'h2', text: '미결사항' });
      B.push(result.meeting.openIssues.length ? { t: 'table', head: ['미결사항', '담당', '출처'], rows: result.meeting.openIssues.map(o => [T(o.text), T(o.owner), o.ref]) } : { t: 'p', text: '없음' });
      B.push({ t: 'h2', text: '후속 조치' });
      B.push(result.meeting.actionItems.length ? { t: 'table', head: ['조치 내용', '담당', '기한'], rows: result.meeting.actionItems.map(a => [T(a.task), T(a.owner), T(a.due)]) } : { t: 'p', text: '없음' });
    } else if (sec.key === 'checks') {
      B.push({ t: 'h1', text: H });
      const c = result.checks, st = (k, x) => (ctx.resolved.has(checkKey(k, x)) ? '해결' : '확인 필요');
      B.push({ t: 'h2', text: `누락 항목 (${c.missing.length})` });
      B.push(c.missing.length ? { t: 'table', head: ['관련', '항목', '빠진 내용', '보완 제안', '상태'], rows: c.missing.map(x => [x.reqId || '전체', T(x.item), T(x.detail), T(x.suggestion), st('missing', x)]) } : { t: 'p', text: '없음' });
      B.push({ t: 'h2', text: `상충 의견 (${c.conflicts.length})` });
      B.push(c.conflicts.length ? { t: 'table', head: ['주제', '의견', '절충 제안', '상태'], rows: c.conflicts.map(x => [`${T(x.topic)}\n(${x.reqIds.join(', ')})`, x.positions.map(p => `${T(p.who)}: ${T(p.stance)}`).join('\n'), T(x.suggestion), st('conflicts', x)]) } : { t: 'p', text: '없음' });
      B.push({ t: 'h2', text: `모호한 표현 (${c.ambiguous.length})` });
      B.push(c.ambiguous.length ? { t: 'table', head: ['원문 표현', '관련', '구체화 제안', '상태'], rows: c.ambiguous.map(x => [`"${T(x.phrase)}"`, x.reqId, T(x.suggestion), st('ambiguous', x)]) } : { t: 'p', text: '없음' });
    } else if (sec.key === 'sourcesList') {
      B.push({ t: 'h1', text: H });
      B.push({ t: 'table', head: ['ID', '구분', '제목', '작성·요청자', '일자'], rows: ctx.sources.map(s => [s.id, KIND_LABEL[s.kind], T(s.mTitle ?? s.title), T(s.mAuthor ?? s.author), s.date]) });
    } else if (sec.key === 'history') {
      B.push({ t: 'h1', text: H });
      B.push(ctx.history.length ? { t: 'table', head: ['일시', '구분', '내용'], rows: ctx.history.map(h => [h.at, h.label, h.changes.map(c => `[${c.type}] ${c.reqId ? c.reqId + ' ' : ''}${T(c.summary)}`).join('\n')]) } : { t: 'p', text: '없음' });
    }
  }
  return B;
}

function blocksToHTML(B) {
  const cell = s => esc(s).replace(/\n/g, '<br>');
  return B.map(b => {
    if (b.t === 'title') return `<h1 class="doc-title">${esc(b.text)}</h1>`;
    if (b.t === 'h1') return `<h2 class="doc-h1">${esc(b.text)}</h2>`;
    if (b.t === 'h2') return `<h3 class="doc-h2">${esc(b.text)}</h3>`;
    if (b.t === 'p') return `<p class="doc-p">${cell(b.text)}</p>`;
    if (b.t === 'bullets') return `<ul class="doc-ul">${b.items.map(i => `<li>${cell(i)}</li>`).join('')}</ul>`;
    if (b.t === 'kv') return `<table class="doc-kv"><tbody>${b.rows.map(r => `<tr><th>${esc(r[0])}</th><td>${cell(r[1])}</td></tr>`).join('')}</tbody></table>`;
    if (b.t === 'table') return `<div class="doc-scroll"><table class="doc-tbl"><thead><tr>${b.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    return '';
  }).join('\n');
}

function blocksToMarkdown(B) {
  const mdCell = s => String(s ?? '').replace(/\|/g, '\\|').replace(/\n/g, '<br>');
  return B.map(b => {
    if (b.t === 'title') return `# ${b.text}`;
    if (b.t === 'h1') return `## ${b.text}`;
    if (b.t === 'h2') return `### ${b.text}`;
    if (b.t === 'p') return b.text;
    if (b.t === 'bullets') return b.items.map(i => `- ${i.replace(/\n/g, ' ')}`).join('\n');
    if (b.t === 'kv') return `| 항목 | 내용 |\n|---|---|\n` + b.rows.map(r => `| ${mdCell(r[0])} | ${mdCell(r[1])} |`).join('\n');
    if (b.t === 'table') return `| ${b.head.map(mdCell).join(' | ')} |\n|${b.head.map(() => '---').join('|')}|\n` + b.rows.map(r => `| ${r.map(mdCell).join(' | ')} |`).join('\n');
    return '';
  }).join('\n\n') + '\n';
}

// 최소 구성 Word(.docx) 파일을 직접 만듭니다.
async function blocksToDocx(B) {
  await loadScript(CDN.jszip);
  const x = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const runs = (text, rpr = '') => String(text ?? '').split('\n').map((line, i) => `<w:r>${rpr ? `<w:rPr>${rpr}</w:rPr>` : ''}${i ? '<w:br/>' : ''}<w:t xml:space="preserve">${x(line)}</w:t></w:r>`).join('');
  const para = (text, style, rpr) => `<w:p>${style ? `<w:pPr><w:pStyle w:val="${style}"/></w:pPr>` : ''}${runs(text, rpr)}</w:p>`;
  const PAGE_W = 14570;
  const tbl = (head, rows, widths) => {
    const cols = head ? head.length : rows[0]?.length || 1;
    const w = widths || Array(cols).fill(Math.floor(PAGE_W / cols));
    const tc = (t, i, isHead) => `<w:tc><w:tcPr><w:tcW w:w="${w[i]}" w:type="dxa"/>${isHead ? '<w:shd w:val="clear" w:color="auto" w:fill="DDEBE7"/>' : ''}</w:tcPr><w:p><w:pPr><w:spacing w:before="20" w:after="20"/></w:pPr>${runs(t, isHead ? '<w:b/><w:sz w:val="18"/>' : '<w:sz w:val="18"/>')}</w:p></w:tc>`;
    const tr = (r, isHead) => `<w:tr>${isHead ? '<w:trPr><w:tblHeader/></w:trPr>' : ''}${r.map((t, i) => tc(t, i, isHead)).join('')}</w:tr>`;
    const bd = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="9AA8A4"/>`).join('');
    return `<w:tbl><w:tblPr><w:tblW w:w="${PAGE_W}" w:type="dxa"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${w.map(v => `<w:gridCol w:w="${v}"/>`).join('')}</w:tblGrid>${head ? tr(head, true) : ''}${rows.map(r => tr(r, false)).join('')}</w:tbl><w:p/>`;
  };
  const colWidths = head => {
    const weight = h => (/ID|번호|우선|중요|유형|분류|수용 여부|확정|상태|구분|일자|일시|관련|기한/.test(h) ? 1 : /내용|정의|검수|사유|출처|의견|제안|빠진|조치|미결/.test(h) ? 3 : 2);
    const ws = head.map(weight), sum = ws.reduce((a, b) => a + b, 0);
    return ws.map(v => Math.floor(PAGE_W * v / sum));
  };
  const body = B.map(b => {
    if (b.t === 'title') return para(b.text, 'Title');
    if (b.t === 'h1') return para(b.text, 'Heading1');
    if (b.t === 'h2') return para(b.text, 'Heading2');
    if (b.t === 'p') return para(b.text);
    if (b.t === 'bullets') return b.items.map(i => para('• ' + i)).join('');
    if (b.t === 'kv') return tbl(null, b.rows.map(r => [r[0], r[1]]), [2800, PAGE_W - 2800]).replace(/<w:tc><w:tcPr><w:tcW w:w="2800" w:type="dxa"\/>/g, '<w:tc><w:tcPr><w:tcW w:w="2800" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="EEF3F1"/>');
    if (b.t === 'table') return tbl(b.head, b.rows, colWidths(b.head));
    return '';
  }).join('');
  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${W}><w:body>${body}<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const font = '<w:rFonts w:ascii="Malgun Gothic" w:hAnsi="Malgun Gothic" w:eastAsia="맑은 고딕" w:cs="Malgun Gothic"/>';
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${W}><w:docDefaults><w:rPrDefault><w:rPr>${font}<w:sz w:val="20"/><w:lang w:val="ko-KR" w:eastAsia="ko-KR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="300" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>
<w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:pPr><w:jc w:val="center"/><w:spacing w:after="240"/></w:pPr><w:rPr><w:b/><w:sz w:val="40"/></w:rPr></w:style>

async function buildXlsx(ctx) {
  await loadScript(CDN.xlsx);
  const X = window.XLSX, T = ctx.tx, wb = X.utils.book_new();
  const add = (name, aoa, widths) => { const ws = X.utils.aoa_to_sheet(aoa); ws['!cols'] = widths.map(w => ({ wch: w })); X.utils.book_append_sheet(wb, ws, name); };
  const cols = ctx.template.columns.filter(c => c.on);
  add('요구사항', [cols.map(c => c.label), ...ctx.result.requirements.map(r => cols.map(c => T(COLUMN_DEFS[c.key] ? COLUMN_DEFS[c.key].get(r, ctx) : '')))], cols.map(c => (/내용|기준|사유|출처|정의/.test(c.label) ? 50 : /명/.test(c.label) ? 28 : 12)));
  const r = ctx.result.requirements;
  add('추적표', [['ID', '요구사항명', '수용 여부', '출처 ID', '발언·작성자', '근거 문장', '검수 기준'], ...r.flatMap(q => (q.sources.length ? q.sources : [{}]).map((s, i) => [q.id, i ? '' : T(q.title), i ? '' : q.status, s.ref || '', T(s.who || ''), T(s.quote || ''), i ? '' : q.acceptanceCriteria.map(T).join('\n')]))], [10, 28, 12, 8, 18, 50, 50]);
  const c = ctx.result.checks;
  add('점검결과', [['구분', '관련', '항목·주제', '내용', '제안', '상태'],
    ...c.missing.map(x => ['누락', x.reqId || '전체', T(x.item), T(x.detail), T(x.suggestion), ctx.resolved.has(checkKey('missing', x)) ? '해결' : '확인 필요']),
    ...c.conflicts.map(x => ['상충', x.reqIds.join(', '), T(x.topic), x.positions.map(p => `${T(p.who)}: ${T(p.stance)}`).join('\n'), T(x.suggestion), ctx.resolved.has(checkKey('conflicts', x)) ? '해결' : '확인 필요']),
    ...c.ambiguous.map(x => ['모호', x.reqId, `"${T(x.phrase)}"`, '', T(x.suggestion), ctx.resolved.has(checkKey('ambiguous', x)) ? '해결' : '확인 필요'])], [8, 14, 20, 50, 50, 10]);
  add('확인질문', [['받는 사람', '역할', '질문', '관련', '이유'], ...ctx.result.questions.flatMap(g => g.items.map(q => [T(g.to), T(g.role), T(q.q), q.reqIds.join(', '), T(q.why)]))], [18, 16, 70, 14, 30]);
  add('변경이력', [['일시', '구분', '유형', '관련', '내용'], ...ctx.history.flatMap(h => h.changes.map(ch => [h.at, h.label, ch.type, ch.reqId, T(ch.summary)]))], [16, 14, 8, 10, 70]);
  const out = X.write(wb, { bookType: 'xlsx', type: 'array' });
  return new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

// ───────── AI 판단 과정 기록 (설명 가능성) ─────────
// 나중에 "왜 이렇게 정리됐는지"를 추적할 수 있도록 입력·보호 조치·AI 호출·요구사항별 판단 근거·사람의 검토를 한 문서로 남깁니다.
// ctx: docCtx() + {calls, maskStats, engine, prompts}
function buildTraceMarkdown(ctx) {
  const { result, tx } = ctx;
  const T = s => tx(s ?? '');
  const cell = s => String(s ?? '').replace(/\|/g, '\|').replace(/\n/g, '<br>');
  const table = (head, rows) => rows.length ? `| ${head.join(' | ')} |\n|${head.map(() => '---').join('|')}|\n` + rows.map(r => `| ${r.map(cell).join(' | ')} |`).join('\n') : '_없음_';
  const reqs = result.requirements;
  const histOf = id => ctx.history.flatMap(h => h.changes.filter(c => c.reqId === id).map(c => ({ at: h.at, label: h.label, ref: h.ref, ...c })));
  const done = (k, x) => (ctx.resolved.has(checkKey(k, x)) ? '해결' : '확인 필요');
  const L = [];
  L.push(`# AI 판단 과정 기록: ${T(result.project.title)}`);
  L.push(table(['항목', '내용'], [
    ['만든 일시', nowStamp()],
    ['도구', `모두의 요구사항 한 번에! v${APP_VERSION}`],
    ['분석 방식', result.isDemo ? '예시 모드: 미리 분석해 둔 결과를 불러옴 (AI를 호출하지 않음)' : ctx.engine],
    ['요구사항', `${reqs.length}건 (확정 ${reqs.filter(r => r.confirmed).length}건)`],
    ['민감정보 표시', ctx.restored ? '이 문서는 가린 값을 원래 값으로 채워 만들었습니다. 외부 공유 전에 확인하세요.' : 'AI에 보낸 상태 그대로([이름-1] 같은 토큰)로 기록했습니다.']
  ]));
  L.push('> 이 문서는 AI가 낸 결과를 사람이 검증할 수 있도록 판단 근거와 처리 과정을 남긴 기록입니다. AI 결과는 초안이며, 확정 표시는 담당자가 직접 확인한 항목입니다.');

  L.push('## 1. 처리 순서');
  L.push(['1. **자료 입력**: 고객 니즈, 회의 내용, 참고 문서를 받음',
    '2. **민감정보 가리기**: 이름·연락처·계좌 등을 이 브라우저 안에서 토큰으로 바꿈. 원래 값은 AI에 보내지 않음',
    '3. **요구사항 추출·분류**: AI가 요구사항, 출처, 유형·우선순위·수용 여부와 그 판단 근거를 정리함',
    '4. **누락·충돌 점검**: AI가 정리된 요구사항을 원 자료와 다시 대조해 빠진 것, 의견이 다른 것, 모호한 표현을 찾음',
    '5. **사람 검토**: 담당자가 수정·확정·해결 표시를 하고, 회신을 받아 다시 반영함',
    '6. **문서 생성**: 확정한 내용으로 양식에 맞춰 문서를 만듦'].join('\n'));

  L.push('## 2. 입력 자료');
  L.push(table(['ID', '구분', '제목', '작성·요청자', '일자', '글자 수', '파일'], ctx.sources.map(s => [s.id, KIND_LABEL[s.kind], T(s.mTitle ?? s.title), T(s.mAuthor ?? s.author), s.date, fmtNum(s.text.length), s.fileName || '직접 입력'])));

  L.push('## 3. 민감정보 보호 조치');
  L.push('AI에 보내기 전에 아래 항목을 토큰으로 바꿨습니다. 원래 값은 이 기록에 남기지 않습니다.');
  L.push(table(['유형', '가림', '가리지 않음(원문 전송)'], ctx.maskStats.map(m => [m.type, `${m.on}종`, m.off ? `${m.off}종` : '-'])));
  if (ctx.maskStats.some(m => m.off)) L.push('> 주의: 담당자가 "가리지 않음"으로 바꾼 항목은 원문 그대로 AI에 전송됐습니다.');

  L.push('## 4. AI 호출 기록');
  L.push(table(['#', '시각', '단계', '실행', '보낸 크기', '받은 글자', '걸린 시간', '결과'], ctx.calls.map((c, i) => [i + 1, c.at, c.step, c.engine, c.inBytes ? `${fmtNum(c.inBytes)} B` : '-', c.outChars ? fmtNum(c.outChars) : '-', c.ms != null ? `${(c.ms / 1000).toFixed(1)}초` : '-', c.ok ? '성공' : `실패: ${c.error || ''}`])));
  L.push('AI에 준 지시문 전문은 이 문서 끝 [부록]에 있습니다. 자료 본문은 3장의 보호 조치를 거친 상태로만 전송됐습니다.');

  L.push('## 5. 요구사항별 판단 근거');
  const cnt = s => reqs.filter(r => r.status === s).length;
  L.push(`전체 ${reqs.length}건: ${STATUSES.map(s => `${s} ${cnt(s)}`).join(', ')}`);
  for (const r of reqs) {
    L.push(`### ${r.id} ${T(r.title)}`);
    L.push(table(['판단', '결과', '근거'], [
      ['추출', T(r.description), T(r.rationale?.extract) || '(기록 없음)'],
      ['유형·우선순위', `${r.category} / ${r.priority}`, T(r.rationale?.classify) || '(기록 없음)'],
      ['수용 여부', `${r.status}${r.statusReason ? `: ${T(r.statusReason)}` : ''}`, T(r.rationale?.decide) || '(기록 없음)'],
      ['확신도', r.confidence || '(기록 없음)', r.confidence === '낮음' ? '근거가 약함. 담당자 확인 필요' : ''],
      ['사람 검토', r.confirmed ? '확정' : '검토 중', '']
    ]));
    if (r.sources.length) L.push('근거 문장\n\n' + r.sources.map(s => `> **[${s.ref}${ctx.srcTitle(s.ref) ? ' ' + ctx.srcTitle(s.ref) : ''}]** ${T(s.who)}: "${T(s.quote)}"`).join('\n>\n'));
    else L.push('> 근거 문장 없음: 출처를 확인해야 합니다.');
    const h = histOf(r.id);
    if (h.length) L.push('변경 이력\n\n' + h.map(c => `- ${c.at} ${c.label}${c.ref ? ` (${c.ref})` : ''}: [${c.type}] ${T(c.summary)}`).join('\n'));
  }

  const c = result.checks;
  L.push('## 6. 누락·충돌 점검 판단');
  L.push('AI가 요구사항 목록을 원 자료와 다시 대조해 찾은 항목입니다. 상태는 담당자가 표시한 처리 결과입니다.');
  L.push('### 빠진 항목');
  L.push(table(['관련', '점검 항목', '왜 빠졌다고 봤는지', '보완 제안', '근거 자료', '상태'], c.missing.map(x => [x.reqId || '전체', T(x.item), T(x.detail), T(x.suggestion), x.ref, done('missing', x)])));
  L.push('### 서로 다른 의견');
  L.push(table(['주제', '관련', '각 입장', '절충 제안', '상태'], c.conflicts.map(x => [T(x.topic), x.reqIds.join(', '), x.positions.map(p => `${T(p.who)}(${p.ref}): ${T(p.stance)}`).join('\n'), T(x.suggestion), done('conflicts', x)])));
  L.push('### 모호한 표현');
  L.push(table(['원문 표현', '관련', '근거 자료', '구체화 제안', '상태'], c.ambiguous.map(x => [`"${T(x.phrase)}"`, x.reqId, x.ref, T(x.suggestion), done('ambiguous', x)])));
  L.push('### 확인 질문');
  L.push(table(['받는 사람', '질문', '관련', '묻는 이유'], result.questions.flatMap(g => g.items.map(q => [`${T(g.to)} (${T(g.role)})`, T(q.q), q.reqIds.join(', '), T(q.why)]))));

  L.push('## 7. 전체 변경 이력');
  L.push(table(['일시', '구분', '근거 자료', '유형', '관련', '내용'], ctx.history.flatMap(h => h.changes.map(ch => [h.at, h.label, h.ref || '-', ch.type, ch.reqId || '-', T(ch.summary)]))));

  L.push('## 8. 유의사항');
  L.push(['- AI 결과는 초안입니다. 수용 여부와 일정은 담당 부서가 최종 결정합니다.',
    '- 확신도 "낮음"이거나 근거 문장이 없는 요구사항은 원 자료로 다시 확인하세요.',
    '- 같은 자료라도 AI 모델이나 실행 시점에 따라 결과가 조금 달라질 수 있습니다. 이 기록은 이번 실행의 판단 과정입니다.'].join('\n'));

  if (ctx.prompts.length) {
    L.push('## 부록. AI에 준 지시문');
    for (const p of ctx.prompts) L.push(`<details><summary>${p.name}</summary>\n\n\`\`\`text\n${p.text.replace(/```/g, "'''")}\n\`\`\`\n\n</details>`);
  }
  return L.join('\n\n') + '\n';
}

// ───────── 품의문 (한글 문서 작성 표준) ─────────
// 내용 모델 하나로 화면 미리보기와 HWPX 파일을 함께 만듭니다.
// 블록: title, h1(1.), h2(가.), box(□), circle(○), dash(-), table, note(*), attach(붙임)
const HANGUL_SEQ = '가나다라마바사아자차카타파하';
const dotDate = iso => { const m = String(iso || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? `${m[1]}. ${+m[2]}. ${+m[3]}.` : String(iso || ''); };
const xmlEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

function buildPumuiBlocks(ctx) {
  const { result, meta, tx } = ctx;
  const T = s => tx(s ?? '');
  const reqs = result.requirements, m = result.meeting;
  const title = T(meta.title || result.project.title);
  const B = [{ t: 'title', text: `${title} 개발 요청` }];
  let n = 0, sub = 0;
  const h1 = text => { B.push({ t: 'h1', text: `${++n}. ${text}` }); sub = 0; };
  const h2 = text => B.push({ t: 'h2', text: `${HANGUL_SEQ[sub++]}. ${text}` });
  const cnt = s => reqs.filter(r => r.status === s).length;
  const kinds = new Set(ctx.sources.map(s => s.kind));
  const basis = [kinds.has('need') && '고객 요청', kinds.has('meeting') && '이해관계자 협의', kinds.has('reply') && '확인 회신', kinds.has('doc') && '현행 자료 검토'].filter(Boolean).join('·') || '검토';

  h1('추진 배경');
  if (result.project.background) B.push({ t: 'box', text: T(result.project.background) });
  B.push({ t: 'box', text: `${basis} 결과를 반영하여 아래와 같이 개발을 요청하고자 함` });

  h1('요청 개요');
  B.push({ t: 'box', text: `요청 건명: ${title}` });
  if (meta.dept) B.push({ t: 'box', text: `요청 부서: ${T(meta.dept)}` });
  if (meta.system) B.push({ t: 'box', text: `대상 시스템: ${T(meta.system)}` });
  if (result.project.summary) B.push({ t: 'box', text: `요청 내용: ${T(result.project.summary)}` });
  B.push({ t: 'box', text: `요구사항: 전체 ${reqs.length}건(수용 ${cnt('수용')}, 조건부 수용 ${cnt('조건부 수용')}, 불가 ${cnt('불가')}, 미결 ${cnt('미결')})` });

  h1('주요 요구사항');
  B.push({ t: 'table', title: '요구사항 목록', head: ['번호', '요구사항명', '유형', '긴급도', '수용 여부'], align: ['c', 'l', 'c', 'c', 'c'], weights: [1.8, 4.4, 1.6, 1.3, 1.7],
    rows: reqs.map(r => [r.id, T(r.title), r.category, r.priority, r.status]) });
  B.push({ t: 'note', text: '* 세부 내용은 붙임 「요구사항명세서」 참조' });
  for (const [st, label] of [['조건부 수용', '조건부 수용 사항'], ['불가', '불가 사항']]) {
    const list = reqs.filter(r => r.status === st);
    if (!list.length) continue;
    h2(label);
    for (const r of list) {
      B.push({ t: 'box', text: `${T(r.title)}(${r.id})` });
      if (r.statusReason) B.push({ t: 'circle', text: T(r.statusReason) });
    }
  }

  h1('협의 결과 및 향후 조치');
  if (m.decisions.length) { h2('결정사항'); m.decisions.forEach(d => B.push({ t: 'box', text: T(d.text) })); }
  if (m.openIssues.length) {
    h2('미결사항');
    m.openIssues.forEach(o => { B.push({ t: 'box', text: T(o.text) }); if (o.owner) B.push({ t: 'dash', text: `담당: ${T(o.owner)}` }); });
  }
  if (m.actionItems.length) {
    h2('후속 조치');
    B.push({ t: 'table', title: '후속 조치 계획', head: ['조치 내용', '담당', '기한'], align: ['l', 'c', 'c'], weights: [5, 2, 1.6],
      rows: m.actionItems.map(a => [T(a.task), T(a.owner) || '미지정', T(a.due) || '미정']) });
  }
  B.push({ t: 'attach', text: '붙임  요구사항명세서 1부.  끝.' });
  return B;
}

// 표준의 문단 간격: 앞 요소에 따라 빈 줄 크기(pt)를 고릅니다.
function pumuiGap(prev, cur) {
  if (!prev) return 0;
  if (cur === 'h1' || cur === 'attach') return 20;
  if (cur === 'h2') return 16;
  if (cur === 'table') return 14;
  if (cur === 'note') return 0;
  if (cur === 'box') return /^h/.test(prev) ? 14 : 10;
  return 6; // circle, dash
}

function pumuiToHTML(B) {
  let prev = null;
  return '<div class="pumui">' + B.map(b => {
    const gap = pumuiGap(prev, b.t); prev = b.t;
    const st = gap ? ` style="margin-top:${gap}pt"` : '';
    if (b.t === 'title') return `<div class="pm-title">${esc(b.text)}</div>`;
    if (b.t === 'h1') return `<p class="pm-h1"${st}>${esc(b.text)}</p>`;
    if (b.t === 'h2') return `<p class="pm-h2"${st}>${esc(b.text)}</p>`;
    if (b.t === 'box') return `<p class="pm-b pm-l2"${st}><span>□</span>${esc(b.text)}</p>`;
    if (b.t === 'circle') return `<p class="pm-b pm-l3"${st}><span>○</span>${esc(b.text)}</p>`;
    if (b.t === 'dash') return `<p class="pm-b pm-l4"${st}><span>-</span>${esc(b.text)}</p>`;
    if (b.t === 'note') return `<p class="pm-note">${esc(b.text)}</p>`;
    if (b.t === 'attach') return `<p class="pm-attach"${st}>${esc(b.text)}</p>`;
    if (b.t === 'table') return `<p class="pm-tt"${st}>${esc(b.title)}</p><div class="doc-scroll"><table class="pm-tbl"><thead><tr>${b.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map((c, i) => `<td class="${b.align[i] === 'l' ? 'l' : ''}">${esc(c).replace(/\n/g, '<br>')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    return '';
  }).join('') + '<div class="pm-page">- 1 -</div></div>';
}

// ── HWPX(OWPML) 쓰기 ──
// 한글이 만든 빈 문서의 구조를 따라 header.xml(글꼴·글자·문단·테두리 모양)과 section0.xml(본문)을 직접 씁니다.
// 단위: HWPUNIT(1pt = 100, 1mm ≈ 283.465)
const mmHU = v => Math.round(v * 283.465);
const HWPX_NS = 'xmlns:ha="http://www.hancom.co.kr/hwpml/2011/app" xmlns:hp="http://www.hancom.co.kr/hwpml/2011/paragraph" xmlns:hp10="http://www.hancom.co.kr/hwpml/2016/paragraph" xmlns:hs="http://www.hancom.co.kr/hwpml/2011/section" xmlns:hc="http://www.hancom.co.kr/hwpml/2011/core" xmlns:hh="http://www.hancom.co.kr/hwpml/2011/head" xmlns:hhs="http://www.hancom.co.kr/hwpml/2011/history" xmlns:hm="http://www.hancom.co.kr/hwpml/2011/master-page" xmlns:hpf="http://www.hancom.co.kr/schema/2011/hpf" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf/" xmlns:ooxmlchart="http://www.hancom.co.kr/hwpml/2016/ooxmlchart" xmlns:hwpunitchar="http://www.hancom.co.kr/hwpml/2016/HwpUnitChar" xmlns:epub="http://www.idpf.org/2007/ops" xmlns:config="urn:oasis:names:tc:opendocument:xmlns:config:1.0"';
const XMLH = '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>';

// 글꼴은 모두 휴먼명조(제목류는 굵게). 글자 모양: 크기 pt, 굵게, 밑줄
const PM_CHAR = [
  { pt: 14, f: 0 },            // 0 본문 내용
  { pt: 12, f: 0 },            // 1 표 내용·주석·쪽 번호
  { pt: 22, f: 0, b: 1 },      // 2 문서 제목
  { pt: 16, f: 0, b: 1 },      // 3 대제목 1.
  { pt: 15, f: 0, b: 1 },      // 4 중제목 가.
  { pt: 14, f: 0, u: 1 },      // 5 표 제목(밑줄)
  { pt: 12, f: 0, b: 1 },      // 6 표 첫 행
  { pt: 20, f: 0 }, { pt: 16, f: 0 }, { pt: 10, f: 0 }, { pt: 6, f: 0 } // 7~10 문단 간격용 빈 줄
];
const PM_GAP_CHAR = { 20: 7, 16: 8, 14: 0, 10: 9, 6: 10 };
// 문단 모양: 정렬, 줄 간격 %, 왼쪽 여백, 내어쓰기(음수)
const PM_PARA = [
  { al: 'JUSTIFY', ls: 160 },                         // 0 바탕(대제목)
  { al: 'CENTER', ls: 160 },                          // 1 제목 상자·표 제목·표를 담는 문단
  { al: 'CENTER', ls: 110 },                          // 2 표 칸(가운데)
  { al: 'JUSTIFY', ls: 110 },                         // 3 표 칸(긴 글)
  { al: 'JUSTIFY', ls: 100 },                         // 4 문단 간격용 빈 줄
  { al: 'JUSTIFY', ls: 160, left: 700 },              // 5 중제목 가.(1칸 들여씀)
  { al: 'JUSTIFY', ls: 160, left: 1400, ind: -1500 }, // 6 □
  { al: 'JUSTIFY', ls: 160, left: 2100, ind: -1500 }, // 7 ○
  { al: 'JUSTIFY', ls: 160, left: 2800, ind: -1000 }, // 8 -
  { al: 'JUSTIFY', ls: 130, left: 1400, ind: -700 },  // 9 주석 *
  { al: 'JUSTIFY', ls: 160, left: 0, ind: -2400 },    // 10 붙임
  { al: 'CENTER', ls: 130 }                           // 11 쪽 번호·머리말
];
const BF = { page: 1, none: 2, cell: 3, cellL: 4, cellR: 5, cellLR: 6, head: 7, headL: 8, headR: 9, headLR: 10, titleBox: 11 };

function hwpxHeader() {
  const font = (id, face, fam) => `<hh:font id="${id}" face="${face}" type="TTF" isEmbedded="0"><hh:typeInfo familyType="${fam}" weight="6" proportion="4" contrast="0" strokeVariation="1" armStyle="1" letterform="1" midline="1" xHeight="1"/></hh:font>`;
  const faces = ['HANGUL', 'LATIN', 'HANJA', 'JAPANESE', 'OTHER', 'SYMBOL', 'USER'].map(l => `<hh:fontface lang="${l}" fontCnt="1">${font(0, '휴먼명조', 'FCAT_MYUNGJO')}</hh:fontface>`).join('');
  const L7 = v => ['hangul', 'latin', 'hanja', 'japanese', 'other', 'symbol', 'user'].map(k => `${k}="${v}"`).join(' ');
  const chars = PM_CHAR.map((c, i) => `<hh:charPr id="${i}" height="${c.pt * 100}" textColor="#000000" shadeColor="none" useFontSpace="0" useKerning="0" symMark="NONE" borderFillIDRef="${BF.none}"><hh:fontRef ${L7(c.f)}/><hh:ratio ${L7(100)}/><hh:spacing ${L7(0)}/><hh:relSz ${L7(100)}/><hh:offset ${L7(0)}/>${c.b ? '<hh:bold/>' : ''}<hh:underline type="${c.u ? 'BOTTOM' : 'NONE'}" shape="SOLID" color="#000000"/><hh:strikeout shape="NONE" color="#000000"/><hh:outline type="NONE"/><hh:shadow type="NONE" color="#C0C0C0" offsetX="10" offsetY="10"/></hh:charPr>`).join('');
  const margin = (p, k) => `<hh:margin><hc:intent value="${(p.ind || 0) * k}" unit="HWPUNIT"/><hc:left value="${(p.left || 0) * k}" unit="HWPUNIT"/><hc:right value="0" unit="HWPUNIT"/><hc:prev value="0" unit="HWPUNIT"/><hc:next value="0" unit="HWPUNIT"/></hh:margin><hh:lineSpacing type="PERCENT" value="${p.ls}" unit="HWPUNIT"/>`;
  const paras = PM_PARA.map((p, i) => `<hh:paraPr id="${i}" tabPrIDRef="0" condense="0" fontLineHeight="0" snapToGrid="1" suppressLineNumbers="0" checked="0" textDir="LTR"><hh:align horizontal="${p.al}" vertical="BASELINE"/><hh:heading type="NONE" idRef="0" level="0"/><hh:breakSetting breakLatinWord="KEEP_WORD" breakNonLatinWord="KEEP_WORD" widowOrphan="0" keepWithNext="0" keepLines="0" pageBreakBefore="0" lineWrap="BREAK"/><hh:autoSpacing eAsianEng="0" eAsianNum="0"/><hp:switch><hp:case hp:required-namespace="http://www.hancom.co.kr/hwpml/2016/HwpUnitChar">${margin(p, 1)}</hp:case><hp:default>${margin(p, 2)}</hp:default></hp:switch><hh:border borderFillIDRef="${BF.none}" offsetLeft="0" offsetRight="0" offsetTop="0" offsetBottom="0" connect="0" ignoreMargin="0"/></hh:paraPr>`).join('');
  // 표: 0.1mm 검정 실선, 양 끝 세로선 없음, 첫 행만 음영(검정 90% 밝게)
  const line = (on, w, c) => `type="${on ? 'SOLID' : 'NONE'}" width="${w}" color="${c}"`;
  const bf = (id, l, r, t, b, fill, w = '0.1 mm', c = '#000000') => `<hh:borderFill id="${id}" threeD="0" shadow="0" centerLine="NONE" breakCellSeparateLine="0"><hh:slash type="NONE" Crooked="0" isCounter="0"/><hh:backSlash type="NONE" Crooked="0" isCounter="0"/><hh:leftBorder ${line(l, w, c)}/><hh:rightBorder ${line(r, w, c)}/><hh:topBorder ${line(t, w, c)}/><hh:bottomBorder ${line(b, w, c)}/><hh:diagonal type="SOLID" width="0.1 mm" color="#000000"/>${fill ? `<hc:fillBrush><hc:winBrush faceColor="${fill}" hatchColor="#999999" alpha="0"/></hc:fillBrush>` : ''}</hh:borderFill>`;
  const G = '#E5E5E5';
  const fills = [bf(1, 0, 0, 0, 0), bf(2, 0, 0, 0, 0, 'none'),
    bf(3, 1, 1, 1, 1), bf(4, 0, 1, 1, 1), bf(5, 1, 0, 1, 1), bf(6, 0, 0, 1, 1),
    bf(7, 1, 1, 1, 1, G), bf(8, 0, 1, 1, 1, G), bf(9, 1, 0, 1, 1, G), bf(10, 0, 0, 1, 1, G),
    bf(11, 0, 0, 1, 1, null, '1.0 mm', '#2E5D8E')].join(''); // 제목 상자: 양단선 1mm
  const styles = [['바탕글', 'Normal', 0, 0], ['본문', 'Body', 0, 0], ['쪽 번호', 'Page Number', 11, 1, 'CHAR'], ['머리말', 'Header', 11, 1], ['각주', 'Footnote', 9, 1], ['미주', 'Endnote', 9, 1], ['캡션', 'Caption', 1, 1]]
    .map(([n, e, pp, cp, type], i) => `<hh:style id="${i}" type="${type || 'PARA'}" name="${n}" engName="${e}" paraPrIDRef="${pp}" charPrIDRef="${cp}" nextStyleIDRef="${type ? 0 : i}" langID="1042" lockForm="0"/>`).join('');
  return `${XMLH}<hh:head ${HWPX_NS} version="1.5" secCnt="1"><hh:beginNum page="1" footnote="1" endnote="1" pic="1" tbl="1" equation="1"/><hh:refList><hh:fontfaces itemCnt="7">${faces}</hh:fontfaces><hh:borderFills itemCnt="11">${fills}</hh:borderFills><hh:charProperties itemCnt="${PM_CHAR.length}">${chars}</hh:charProperties><hh:tabProperties itemCnt="1"><hh:tabPr id="0" autoTabLeft="0" autoTabRight="0"/></hh:tabProperties><hh:paraProperties itemCnt="${PM_PARA.length}">${paras}</hh:paraProperties><hh:styles itemCnt="7">${styles}</hh:styles></hh:refList><hh:compatibleDocument targetProgram="HWP201X"><hh:layoutCompatibility/></hh:compatibleDocument><hh:docOption><hh:linkinfo path="" pageInherit="0" footnoteInherit="0"/></hh:docOption><hh:trackchageConfig flags="56"/></hh:head>`;
}

function hwpxSection(B) {
  let pid = 1, oid = 1;
  const p = (pp, cp, inner) => `<hp:p id="${pid++}" paraPrIDRef="${pp}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="${cp}">${inner}</hp:run></hp:p>`;
  const tp = (pp, cp, text) => p(pp, cp, text ? `<hp:t>${xmlEsc(text)}</hp:t>` : '<hp:t/>');
  const W = 59528 - 2 * mmHU(20); // 본문 폭
  const table = (rows, widths, cellFn, rowH = mmHU(7)) => {
    const R = rows.length, C = widths.length;
    const trs = rows.map((row, r) => `<hp:tr>${row.map((txt, c) => {
      const { bf, pp, cp } = cellFn(r, c);
      const paras = String(txt ?? '').split('\n').map(line => tp(pp, cp, line)).join('');
      return `<hp:tc name="" header="${r === 0 && R > 1 ? 1 : 0}" hasMargin="0" protect="0" editable="0" dirty="0" borderFillIDRef="${bf}"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="CENTER" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${paras}</hp:subList><hp:cellAddr colAddr="${c}" rowAddr="${r}"/><hp:cellSpan colSpan="1" rowSpan="1"/><hp:cellSz width="${widths[c]}" height="${rowH}"/><hp:cellMargin left="510" right="510" top="142" bottom="142"/></hp:tc>`;
    }).join('')}</hp:tr>`).join('');
    const id = 1000000 + oid++;
    return p(1, 0, `<hp:tbl id="${id}" zOrder="${oid}" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="1" rowCnt="${R}" colCnt="${C}" cellSpacing="0" borderFillIDRef="${BF.page}" noAdjust="0"><hp:sz width="${W}" widthRelTo="ABSOLUTE" height="${rowH * R}" heightRelTo="ABSOLUTE" protect="0"/><hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/><hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:inMargin left="510" right="510" top="142" bottom="142"/>${trs}</hp:tbl><hp:t/>`);
  };
  const splitW = weights => { const sum = weights.reduce((a, b) => a + b, 0); const w = weights.map(v => Math.floor(W * v / sum)); w[w.length - 1] += W - w.reduce((a, b) => a + b, 0); return w; };
  const notePr = k => `<hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar=")" supscript="0"/><hp:noteLine length="${k ? 14692344 : -1}" type="SOLID" width="0.12 mm" color="#000000"/><hp:noteSpacing betweenNotes="${k ? 0 : 283}" belowLine="567" aboveLine="850"/><hp:numbering type="CONTINUOUS" newNum="1"/><hp:placement place="${k ? 'END_OF_DOCUMENT' : 'EACH_COLUMN'}" beneathText="0"/>`;
  // 용지: A4, 위 20·아래 10·좌우 20, 머리말·꼬리말 10(mm)
  const secPr = `<hp:secPr id="" textDirection="HORIZONTAL" spaceColumns="1134" tabStop="8000" tabStopVal="4000" tabStopUnit="HWPUNIT" outlineShapeIDRef="0" memoShapeIDRef="0" textVerticalWidthHead="0" masterPageCnt="0"><hp:grid lineGrid="0" charGrid="0" wonggojiFormat="0"/><hp:startNum pageStartsOn="BOTH" page="0" pic="0" tbl="0" equation="0"/><hp:visibility hideFirstHeader="0" hideFirstFooter="0" hideFirstMasterPage="0" border="SHOW_ALL" fill="SHOW_ALL" hideFirstPageNum="0" hideFirstEmptyLine="0" showLineNumber="0"/><hp:lineNumberShape restartType="0" countBy="0" distance="0" startNumber="0"/><hp:pagePr landscape="WIDELY" width="59528" height="84186" gutterType="LEFT_ONLY"><hp:margin header="${mmHU(10)}" footer="${mmHU(10)}" gutter="0" left="${mmHU(20)}" right="${mmHU(20)}" top="${mmHU(20)}" bottom="${mmHU(10)}"/></hp:pagePr><hp:footNotePr>${notePr(0)}</hp:footNotePr><hp:endNotePr>${notePr(1)}</hp:endNotePr>${['BOTH', 'EVEN', 'ODD'].map(t => `<hp:pageBorderFill type="${t}" borderFillIDRef="${BF.page}" textBorder="PAPER" headerInside="0" footerInside="0" fillArea="PAPER"><hp:offset left="1417" right="1417" top="1417" bottom="1417"/></hp:pageBorderFill>`).join('')}</hp:secPr>`;
  // 첫 문단: 구역 설정, 단 설정, 쪽 번호(가운데 아래 "- 1 -")
  let body = `<hp:p id="0" paraPrIDRef="0" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="0">${secPr}<hp:ctrl><hp:colPr id="" type="NEWSPAPER" layout="LEFT" colCount="1" sameSz="1" sameGap="0"/></hp:ctrl><hp:ctrl><hp:pageNum pos="BOTTOM_CENTER" formatType="DIGIT" sideChar="-"/></hp:ctrl></hp:run><hp:run charPrIDRef="0"><hp:t/></hp:run></hp:p>`;
  let prev = null;
  for (const b of B) {
    const gap = pumuiGap(prev, b.t); prev = b.t;
    if (gap) body += tp(4, PM_GAP_CHAR[gap], '');
    if (b.t === 'title') body += table([[b.text]], [W], () => ({ bf: BF.titleBox, pp: 1, cp: 2 }), mmHU(15));
    else if (b.t === 'h1') body += tp(0, 3, b.text);
    else if (b.t === 'h2') body += tp(5, 4, b.text);
    else if (b.t === 'box') body += tp(6, 0, `□ ${b.text}`);
    else if (b.t === 'circle') body += tp(7, 0, `○ ${b.text}`);
    else if (b.t === 'dash') body += tp(8, 0, `- ${b.text}`);
    else if (b.t === 'note') body += tp(9, 1, b.text);
    else if (b.t === 'attach') body += tp(10, 0, b.text);
    else if (b.t === 'table') {
      body += tp(1, 5, b.title);
      const C = b.head.length;
      const edge = c => (C === 1 ? 'LR' : c === 0 ? 'L' : c === C - 1 ? 'R' : '');
      body += table([b.head, ...b.rows], splitW(b.weights), (r, c) => ({
        bf: BF[(r === 0 ? 'head' : 'cell') + edge(c)],
        pp: r === 0 || b.align[c] !== 'l' ? 2 : 3,
        cp: r === 0 ? 6 : 1
      }));
    }
  }
  return `${XMLH}<hs:sec ${HWPX_NS}>${body}</hs:sec>`;
}

// 압축 파일 구성은 한글이 저장한 빈 문서와 같습니다(mimetype은 압축하지 않고 맨 앞).
function hwpxParts(ctx) {
  const B = buildPumuiBlocks(ctx);
  const title = B[0].text;
  const stamp = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  const pkg = 'http://www.hancom.co.kr/hwpml/2016/meta/pkg#';
  return [
    ['mimetype', 'application/hwp+zip'],
    ['version.xml', `${XMLH}<hv:HCFVersion xmlns:hv="http://www.hancom.co.kr/hwpml/2011/version" tagetApplication="WORDPROCESSOR" major="5" minor="1" micro="1" buildNumber="0" os="1" xmlVersion="1.5" application="Hancom Office Hangul" appVersion="13, 0, 0, 1408 WIN32LEWindows_10"/>`],
    ['Contents/header.xml', hwpxHeader()],
    ['Contents/section0.xml', hwpxSection(B)],
    ['Preview/PrvText.txt', title + '\r\n'],

// 서식(노란 머리글, 테두리, 병합, 필터, 목록)을 넣기 위해 xlsx를 직접 만듭니다.
function specXlsxParts(ctx) {
  const T = ctx.tx;
  const colL = i => String.fromCharCode(65 + i);
  const cell = (ref, v, s) => `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  // 스타일: 1 노란 라벨, 2 값, 3 머리글, 4 내용 가운데, 5 내용 왼쪽
  const data = specRows(ctx);
  const rows = [
    `<row r="1">${cell('A1', '관련개발요청', 1)}${cell('B1', T(ctx.meta.title || ctx.result.project.title), 2)}${cell('C1', '', 2)}${cell('D1', '', 2)}${cell('E1', '작성자', 1)}${cell('F1', T(ctx.meta.author), 2)}${cell('G1', '작성일', 1)}${cell('H1', ctx.meta.date, 2)}</row>`,
    `<row r="3">${SPEC_COLS.map((c, i) => cell(colL(i) + 3, c.label, 3)).join('')}</row>`,
    ...data.map((row, k) => `<row r="${k + 4}">${row.map((v, i) => cell(colL(i) + (k + 4), v, SPEC_COLS[i].al === 'c' ? 4 : 5)).join('')}</row>`)
  ];
  const end = data.length + 3;
  const dv = SPEC_COLS.map((c, i) => (c.list ? `<dataValidation type="list" allowBlank="1" showErrorMessage="1" sqref="${colL(i)}4:${colL(i)}${end + 200}"><formula1>"${c.list.join(',')}"</formula1></dataValidation>` : '')).filter(Boolean);
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"><pane ySplit="3" topLeftCell="A4" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="16.5"/><cols>${SPEC_COLS.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.join('')}</sheetData><autoFilter ref="A3:H${end}"/><mergeCells count="1"><mergeCell ref="B1:D1"/></mergeCells><dataValidations count="${dv.length}">${dv.join('')}</dataValidations><pageMargins left="0.5" right="0.5" top="0.75" bottom="0.75" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape"/></worksheet>`;
  const font = b => `<font>${b ? '<b/>' : ''}<sz val="10"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font>`;
  const side = k => `<${k} style="thin"><color rgb="FF808080"/></${k}>`;
  const xf = (f, fill, h, v = 'center') => `<xf numFmtId="0" fontId="${f}" fillId="${fill}" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="${h}" vertical="${v}" wrapText="1"/></xf>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2">${font(0)}${font(1)}</fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFFFF00"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border>${['left', 'right', 'top', 'bottom'].map(side).join('')}<diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${xf(1, 2, 'center')}${xf(0, 0, 'left')}${xf(1, 2, 'center')}${xf(0, 0, 'center')}${xf(0, 0, 'left', 'top')}</cellXfs><cellStyles count="1"><cellStyle name="표준" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const SHEET = '요구사항명세(상세)';
  return [
    ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
    ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${SHEET}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${SHEET}'!$A$3:$H$${end}</definedName></definedNames></workbook>`],
    ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ['xl/worksheets/sheet1.xml', sheet],
    ['xl/styles.xml', styles]
  ];
}

const S = {

};

function addSource(kind, fields) {
  const s = Object.assign({ id: 'S' + S.nextId++, kind, title: '', author: '', date: today(), text: '' }, fields);
  S.sources.push(s);
  return s;
}
function loadSample() {
  S.sources = []; S.nextId = 1; S.M = createMasker();
  SAMPLE_SOURCES.forEach(s => addSource(s.kind, clone(s)));
  S.result = null; S.history = []; S.resolved = new Set(); S.run = null; S.trace = []; S.importLog = null;
  S.meta.title = ''; S.meta.dept = S.meta.dept || '○○사업부';
}
function sampleIntact() {
  const base = S.sources.filter(s => s.kind !== 'reply');
  return base.length === SAMPLE_SOURCES.length && SAMPLE_SOURCES.every((x, i) => base[i].text.trim() === x.text.trim() && base[i].kind === x.kind);
}
function maskAll(list = S.sources) {
  // 먼저 모든 자료에서 민감정보를 찾아 둔 뒤 가려야, 뒤 자료에서 찾은 이름도 앞 자료에서 가려집니다.
  for (const s of S.sources) findSpans(S.M, `${s.title}\n${s.author}\n${s.text}`);
  for (const s of list) { s.mTitle = maskText(S.M, s.title); s.mAuthor = maskText(S.M, s.author); s.masked = maskText(S.M, s.text); }
  return list;
}
function bindDemo(obj) {
  return JSON.parse(JSON.stringify(obj).replace(/\{\{([^}]+)\}\}/g, (_, name) => {
    for (const it of S.M.items.values()) if (it.on && it.value === name) return it.token;
    return name;
  }));
}
const srcById = id => S.sources.find(s => s.id === id);
const R = t => richText(S.M, t, S.showOriginal);

// ───────── AI 연결 확인 ─────────
// 사내 LLM(serve.py 프록시)이 설정돼 있으면 그것을 먼저 쓰고, 아니면 claude.ai, 둘 다 없으면 예시 모드입니다.
async function detectAI() {
  try {
    if (CFG.llm && CFG.llm.endpoint) {
      S.ai.provider = 'local'; S.ai.model = CFG.llm.model || '';
      const h = await fetch(CFG.llm.health || '/api/health', { cache: 'no-store' }).then(r => r.json()).catch(() => ({ ok: false, error: 'serve.py에 연결하지 못했습니다.' }));
      S.ai.state = h.ok ? 'ready' : 'down';
      S.ai.note = h.ok ? '' : (h.error || 'AI에 연결하지 못했습니다.');
      if (h.model) S.ai.model = h.model;
    } else if (window.claude && typeof window.claude.use === 'function') {
      S.ai.provider = 'claude';
      const [sample, downloads] = await Promise.all([window.claude.use('sample'), window.claude.use('downloads')]);
      S.ai.sample = sample; S.ai.downloads = downloads;
      S.ai.state = typeof sample === 'function' ? 'ready' : 'demo';
    } else S.ai.state = 'demo';
  } catch { S.ai.state = 'demo'; }
  renderBadge();
  if (S.step === 3) render();
}
function renderBadge() {
  const el = $('#ai-badge');
  const st = S.ai.state;
  el.className = 'ai-badge ' + st;
  const local = S.ai.provider === 'local';
  el.innerHTML = st === 'ready' ? (local && S.ai.fallback ? `<i></i>Claude 크레딧 부족 · ${esc(S.ai.fallbackModel || '대체 모델')}로 분석` : local ? `<i></i>${esc(CFG.llm?.label || '사내 LLM')} 연결됨${S.ai.model ? ' · ' + esc(S.ai.model) : ''}` : '<i></i>AI 연결됨')
    : st === 'checking' ? '<i></i>AI 연결 확인 중'
    : st === 'denied' ? '<i></i>AI 사용 안 함 · 예시 모드'
    : st === 'down' ? `<i></i>${esc(CFG.llm?.label || '사내 LLM')} 연결 안 됨 · 예시 모드`
    : '<i></i>예시 모드 · AI 미연결';
  el.title = st === 'ready' ? (local ? `분석은 settings.json에 지정한 ${esc(CFG.llm?.label || '사내 LLM')}로 실행됩니다.` : '분석은 보는 사람의 Claude 계정으로 실행됩니다.')
    : st === 'down' ? S.ai.note + ' 사용자 매뉴얼의 문제 해결을 참고하세요.'
    : 'claude.ai나 사내 LLM에 연결하면 내 자료를 AI로 분석할 수 있습니다. 지금은 예시 결과로 모든 기능을 체험할 수 있습니다.';
}

const STEPS = [

function canGo(n) {
  if (n <= 2) return true;

}
function render() {
  $('#stepper').innerHTML = STEPS.map(s => `<button class="step ${S.step === s.n ? 'on' : ''} ${s.n < S.step || (s.n > 3 && S.result) ? 'done' : ''}" data-act="go" data-n="${s.n}" ${canGo(s.n) ? '' : 'disabled'} aria-current="${S.step === s.n ? 'step' : 'false'}"><b>${s.n}</b><span>${s.label}</span></button>`).join('<span class="step-line" aria-hidden="true"></span>');
  const v = [null, viewInput, viewMask, viewAnalyze, viewReview, viewExport][S.step];

  afterRender();
}
function afterRender() {
  $$('textarea[data-autosize]').forEach(autosize);
}
function autosize(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 640) + 'px'; }
